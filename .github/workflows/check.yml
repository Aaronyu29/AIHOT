# Checks on GitHub-hosted runners: install, typecheck, web build, the web and backend tests on a fresh
# PostgreSQL, the built site's smoke check on the empty database, and the Docker image brought up with docker compose.
# Only GitHub-owned actions, pinned to a full commit SHA.
name: Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: aihot_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      DATABASE_URL: postgres://postgres:ci@127.0.0.1:5432/aihot_ci
      SITE_URL: http://127.0.0.1:3000
      API_BASE_URL: http://127.0.0.1:3001
      SESSION_SECRET: ci-session-secret-0123456789abcdef
      IMG_PROXY_SIGN_SECRET: ci-img-secret-0123456789abcdef
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Online migration safety
        # New migrations against the PR base: deployed ones unchanged, no whole-table rewrite or blocking index in a release.
        env:
          MIGRATION_BASE: ${{ github.event.pull_request.base.sha || github.sha }}
        run: node scripts/check-migrations.ts --base "$MIGRATION_BASE"
      - name: PostgreSQL backup tools
        # 恢复测试需要与 PostgreSQL 17 服务匹配的客户端，不能依赖 runner 的默认版本。
        run: |
          # The runner's Azure mirror repeatedly stalled dependency downloads; use Ubuntu's archive and bounded retries.
          sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|http://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
          printf '%s\n' 'Acquire::http::Timeout "30";' 'Acquire::https::Timeout "30";' 'Acquire::Retries "2";' | sudo tee /etc/apt/apt.conf.d/99-ci-download-timeouts >/dev/null
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --silent --show-error -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
          /usr/lib/postgresql/17/bin/pg_dump --version
          /usr/lib/postgresql/17/bin/pg_restore --version
      - name: Typecheck
        run: npm run typecheck
      - name: Release artifact guards
        run: |
          python3 -m py_compile scripts/deploy-ci.py deploy/install-ci-release.py
          python3 deploy/test_ci_release.py
      - name: Build web
        run: npm run build -w @aihot/web
      - name: Browser test engines
        run: npx playwright install --with-deps chromium webkit
      - name: Web tests
        run: node --test apps/web/tests/*.test.ts

      # Each test file runs on its own copy of aihot_ci (tests/databases.ts), which the run migrates and
      # leaves empty; the smoke check then reads that empty database.
      - name: Backend tests
        run: npm test
      - name: Smoke check of the built site
        # The site itself runs with collection and model calls off (the tests above use local stubs).
        env:
          COLLECT_ENABLED: "false"
          MODEL_CALLS_ENABLED: "false"
        run: |
          node apps/api/src/main.ts > "$RUNNER_TEMP/api.log" 2>&1 &
          (cd apps/web && NODE_ENV=production exec node server.ts) > "$RUNNER_TEMP/web.log" 2>&1 &
          for i in $(seq 1 60); do curl -fsS -o /dev/null http://127.0.0.1:3000/api/health 2>/dev/null && break; sleep 1; done
          node scripts/smoke.ts --base http://127.0.0.1:3000
          node scripts/mcp-check.ts http://127.0.0.1:3000/api/mcp
      - name: Server logs
        if: failure()
        run: tail -n 60 "$RUNNER_TEMP/api.log" "$RUNNER_TEMP/web.log" 2>/dev/null || true

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Configure a throwaway site
        run: |
          node scripts/init-env.ts --llm-key ci-not-a-real-key
          # No outside calls in CI: nothing is collected and no model is asked.
          sed -i 's/^COLLECT_ENABLED=.*/COLLECT_ENABLED=false/; s/^MODEL_CALLS_ENABLED=.*/MODEL_CALLS_ENABLED=false/' .env
          # The smoke check reaches the site by its compose service name.
          echo "MCP_ALLOWED_HOSTS=web" >> .env
      - name: Build and start with docker compose
        run: |
          docker build --label "org.opencontainers.image.revision=$GITHUB_SHA" -t "aihot-app:$GITHUB_SHA" .
          docker tag "aihot-app:$GITHUB_SHA" aihot-app
          docker compose up -d --no-build
      - name: Smoke check
        run: |
          for i in $(seq 1 90); do curl -fsS -o /dev/null http://127.0.0.1:3000/api/health 2>/dev/null && break; sleep 2; done
          docker compose ps
          docker compose run --rm --no-deps --entrypoint node setup scripts/smoke.ts --base http://web:3000
          docker compose exec -T db psql -U aihot -d aihot -Atc "select count(*) from sources" | grep -qx "$(node -p "require('./industry/sources.json').sources.length")"
      - name: Export the tested release image
        run: |
          mkdir -p "$RUNNER_TEMP/release"
          docker save "aihot-app:$GITHUB_SHA" | gzip -1 > "$RUNNER_TEMP/release/image.tar.gz"
          cp deploy/install-ci-release.py "$RUNNER_TEMP/release/"
          docker inspect --format '{{.Id}}' "aihot-app:$GITHUB_SHA" > "$RUNNER_TEMP/release/image-id.txt"
          python3 - <<'PY'
          import json, os, pathlib
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'release'
          (root / 'release.json').write_text(json.dumps({'sha': os.environ['GITHUB_SHA'], 'runId': os.environ['GITHUB_RUN_ID'], 'imageId': (root / 'image-id.txt').read_text().strip()}))
          PY
          cd "$RUNNER_TEMP/release"
          sha256sum image.tar.gz install-ci-release.py release.json > SHA256SUMS
      - name: Exercise the release installer on the throwaway site
        run: |
          # PR merge commits are not origin/main. A local test origin exercises the same
          # latest-main guard without bypass flags or production credentials.
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            git init --bare "$RUNNER_TEMP/release-origin.git"
            git push "$RUNNER_TEMP/release-origin.git" "$GITHUB_SHA:refs/heads/main"
            git remote set-url origin "$RUNNER_TEMP/release-origin.git"
          fi
          mkdir -p .data
          docker compose --profile https up -d --no-build caddy
          python3 deploy/install-ci-release.py --root "$PWD" --bundle "$RUNNER_TEMP/release" --sha "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID"
      - name: Keep the tested release image
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: aihot-image-${{ github.sha }}
          path: ${{ runner.temp }}/release/
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
      - name: Logs
        if: failure()
        run: docker compose logs --tail 80
      - name: Stop
        if: always()
        # CI uses only stubs with model calls and collection disabled; production keeps its 515s grace period.
        run: docker compose --profile https down -v --timeout 30
